<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <script>
    (function () {
      // • GitHub Pages PROJECT site (user.github.io/coop-reader/): 1
      // • GitHub Pages USER site or custom domain at root:       0
      var PATH_SEGMENTS_TO_KEEP = 1;

      var l = window.location;
      var segments = l.pathname.split('/').filter(Boolean);

      if (!segments.length) {
        l.replace(l.protocol + '//' + l.host + '/');
        return;
      }

      var base = segments.slice(0, PATH_SEGMENTS_TO_KEEP).join('/');
      var rest = segments.slice(PATH_SEGMENTS_TO_KEEP).join('/');
      var redirectPath =
        '/' + (base ? base + '/' : '') +
        '?p=' + encodeURIComponent('/' + rest) +
        l.hash;

      l.replace(l.protocol + '//' + l.host + redirectPath);
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=/"></noscript>
</head>
<body></body>
</html>
